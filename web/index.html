<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060B14">
<title>Palmyn Demo</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* Estilo "Marca Palmyn": mismos tokens que la web nueva (Nueva Palmyn Web/src/styles/global.css) */
  :root {
    --bg:#060B14; --bg2:#0A1220; --bg3:#0F1A2E; --line:#1b2740; --text:#EAF0FB; --text2:#B9C5DD; --muted:#8393B4;
    --blue:#1A72F8; --blue2:#4D8FFF; --teal:#00E5B0; --violet:#A78BFA; --red:#FF6B6B; --amber:#FFB454;
    --grad-brand:linear-gradient(135deg,#4D8FFF 0%,#1A72F8 45%,#8B7CF6 100%);
    --font:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono:"Space Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:#03060c; color:var(--text); font:15px/1.45 var(--font); }
  button { font:inherit; }
  [hidden] { display:none !important; }

  /* contenedor: pantalla completa en el celu, "teléfono" centrado en desktop */
  .app { position:relative; width:100%; max-width:460px; height:100dvh; margin:0 auto; background:var(--bg); overflow:hidden; }
  @media (min-width: 700px) { body { display:flex; align-items:center; } .app { height:min(880px, 94dvh); border-radius:32px; border:1px solid var(--line); box-shadow:0 30px 90px #000c; } }
  .screen { position:absolute; inset:0; display:flex; flex-direction:column; }
  .dots { position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px); background-size:20px 20px; pointer-events:none; }
  .glow { position:absolute; width:420px; height:420px; border-radius:50%; top:-200px; left:-80px; pointer-events:none; background:radial-gradient(circle, rgba(26,114,248,.45), transparent 65%); }
  .glow.teal { background:radial-gradient(circle, rgba(0,229,176,.32), transparent 65%); }
  .glow.red { background:radial-gradient(circle, rgba(255,107,107,.3), transparent 65%); }

  .bar { position:relative; z-index:2; display:flex; justify-content:space-between; align-items:center; padding:max(18px, env(safe-area-inset-top)) 18px 6px; gap:8px; }
  .logo { display:flex; align-items:center; gap:8px; font-weight:700; letter-spacing:.01em; }
  .logo img { width:26px; height:26px; display:block; }
  .pill { font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; padding:4px 9px; border-radius:99px; border:1px solid var(--line); color:var(--text2); background:rgba(6,11,20,.5); white-space:nowrap; }
  .pill.dev { color:var(--amber); border-color:#4a3714; }
  .icons { display:flex; gap:6px; }
  .ibtn { width:34px; height:34px; border-radius:11px; border:1px solid var(--line); background:rgba(6,11,20,.55); color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer; backdrop-filter:blur(8px); }
  .lang { display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 10px; border-radius:11px; border:1px solid var(--line); background:rgba(6,11,20,.55); color:var(--text2); font-family:var(--mono); font-size:12px; letter-spacing:.04em; cursor:pointer; backdrop-filter:blur(8px); transition:color .15s, border-color .15s; }
  .lang:hover { color:var(--text); border-color:#34425f; }
  .lang svg { width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .icons { align-items:center; }
  .gh svg { fill:currentColor; stroke:none; width:16px; height:16px; }
  @media (max-width:380px) { #scrConsent .pill, #scrResult .pill { display:none; } }
  .ibtn svg { width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

  .eyebrow { font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--blue2); }
  h1 { font-size:30px; line-height:1.1; margin:8px 0 6px; letter-spacing:-.02em; }
  h1 em { font-style:normal; background:linear-gradient(135deg,#4D8FFF,#8B7CF6); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .lead { color:var(--text2); font-size:14px; margin:0 0 16px; }

  .btn { width:100%; border:0; border-radius:14px; padding:15px; font-weight:600; font-size:15px; color:#fff; cursor:pointer; background:linear-gradient(180deg,#3F87FF,#1A72F8); box-shadow:0 0 0 1px rgba(255,255,255,.08) inset, 0 10px 30px -10px rgba(26,114,248,.75); transition:opacity .15s, transform .1s; }
  .btn:active:not(:disabled) { transform:scale(.99); }
  .btn:disabled { opacity:.4; box-shadow:none; cursor:not-allowed; }
  .ghost { width:100%; border:1px solid var(--line); background:transparent; color:var(--text); border-radius:14px; padding:13px; font-weight:600; font-size:14px; margin-top:8px; cursor:pointer; }
  .link { background:none; border:0; color:var(--muted); font-size:12px; text-decoration:underline; cursor:pointer; padding:4px; }

  /* ── consentimiento ── */
  .cbody { position:relative; flex:1; overflow:auto; padding:10px 18px; }
  .item { position:relative; display:flex; gap:12px; padding:13px; border-radius:14px; margin-bottom:9px; cursor:pointer; background:var(--bg2); border:1px solid var(--line); }
  .item:has(input:checked) { background:linear-gradient(var(--bg2),var(--bg2)) padding-box, linear-gradient(135deg, rgba(77,143,255,.6), transparent 45%, transparent 60%, rgba(0,229,176,.45)) border-box; border-color:transparent; }
  .item input { position:absolute; opacity:0; pointer-events:none; }
  .box { width:22px; height:22px; border-radius:7px; flex:none; border:1.5px solid #34425f; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; color:transparent; transition:.15s; }
  .item input:checked + .box { background:var(--teal); border-color:var(--teal); color:#04231B; }
  .item input:focus-visible + .box { outline:2px solid var(--blue2); outline-offset:2px; }
  .item b { font-size:14px; font-weight:600; display:block; } .item small { color:var(--muted); font-size:12.5px; display:block; margin-top:2px; }
  .more { font-size:12.5px; margin-top:6px; } .more summary { color:var(--blue2); cursor:pointer; list-style:none; } .more summary::-webkit-details-marker { display:none; }
  .more ul { padding-left:16px; margin:6px 0 0; color:var(--text2); }
  .opt { display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:12.5px; color:var(--text2); padding:11px 13px; border-radius:12px; border:1px dashed var(--line); cursor:pointer; margin-top:4px; }
  .opt i { color:var(--muted); }
  .tg { position:relative; width:40px; height:24px; flex:none; } .tg input { position:absolute; opacity:0; width:0; height:0; }
  .tg span { position:absolute; inset:0; border-radius:99px; background:#1d2942; transition:.15s; }
  .tg span::after { content:""; position:absolute; left:3px; top:3px; width:18px; height:18px; border-radius:50%; background:var(--muted); transition:.15s; }
  .tg input:checked + span { background:var(--blue); } .tg input:checked + span::after { left:19px; background:#fff; }
  .tg input:focus-visible + span { outline:2px solid var(--blue2); outline-offset:2px; }
  .cfoot { position:relative; padding:12px 18px max(20px, env(safe-area-inset-bottom)); }
  .legal { margin:10px 0 0; text-align:center; font-size:11.5px; color:var(--muted); } .legal a { color:var(--text2); }
  .meter { display:flex; gap:5px; margin-bottom:10px; } .meter i { flex:1; height:4px; border-radius:4px; background:#1d2942; transition:.2s; } .meter i.on { background:var(--teal); }

  /* ── cámara ── */
  .stage { position:absolute; inset:0; background:radial-gradient(110% 80% at 50% 40%, #1a2a44 0%, #060B14 75%); }
  .stage video, .stage canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .mirror { transform:scaleX(-1); }
  .guide.mirror { transform:translate(-50%,-50%) scaleX(-1); }
  /* guía: esqueleto de 21 puntos (mano izquierda, palma a la cámara, dedos a la derecha) */
  .guide { position:absolute; left:50%; top:40%; transform:translate(-50%,-50%); width:min(92%, 400px); pointer-events:none; transition:opacity .3s; }
  .guide line { stroke:#4D8FFF; stroke-opacity:.55; stroke-width:1.6; }
  .guide circle { fill:#00E5B0; animation:twinkle 2.2s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity:.25 } 40% { opacity:1 } }
  .scan { position:absolute; left:8%; right:8%; height:2px; top:20%; background:linear-gradient(90deg, transparent, var(--teal), transparent); box-shadow:0 0 14px var(--teal); animation:scan 1.4s ease-in-out infinite; pointer-events:none; }
  @keyframes scan { 0%,100% { top:16% } 50% { top:60% } }
  .toast { position:absolute; z-index:3; left:50%; top:calc(max(18px, env(safe-area-inset-top)) + 48px); transform:translateX(-50%); font-family:var(--mono); font-size:11px; letter-spacing:.04em; text-transform:uppercase; padding:7px 13px; border-radius:99px; white-space:nowrap; max-width:92%; overflow:hidden; text-overflow:ellipsis; background:rgba(6,11,20,.75); color:var(--text2); border:1px solid var(--line); backdrop-filter:blur(8px); transition:background .2s, color .2s; }
  .toast.ok { background:var(--teal); color:#04231B; border-color:transparent; }
  .toast.warn { background:var(--amber); color:#2a1a00; border-color:transparent; }
  .toast.err { background:var(--red); color:#2a0505; border-color:transparent; white-space:normal; text-align:center; text-transform:none; }
  .sheet { position:absolute; z-index:3; left:0; right:0; bottom:0; padding:14px 16px max(16px, env(safe-area-inset-bottom)); background:rgba(10,18,32,.86); backdrop-filter:blur(14px); border-top:1px solid var(--line); border-radius:22px 22px 0 0; }
  .seg { display:grid; grid-template-columns:1fr 1fr; background:var(--bg3); border-radius:12px; padding:4px; margin-bottom:12px; }
  .seg button { border:0; background:transparent; padding:9px; border-radius:9px; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; }
  .seg button.on { background:#1d2c4a; color:var(--text); }
  .seg button:disabled { opacity:.4; cursor:not-allowed; }
  .shots { display:flex; justify-content:center; align-items:center; gap:8px; margin-bottom:12px; font-family:var(--mono); font-size:11px; color:var(--muted); }
  .shots i { width:9px; height:9px; border-radius:50%; background:#1d2942; transition:.2s; } .shots i.on { background:var(--teal); box-shadow:0 0 8px var(--teal); }
  .tok { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:10px; font-family:var(--mono); font-size:10.5px; color:var(--muted); min-height:24px; }
  .tok b { color:var(--text2); font-weight:400; }
  .rois { display:flex; gap:6px; justify-content:center; margin-top:8px; }
  .rois canvas { width:56px; height:56px; border-radius:8px; border:1px solid var(--line); }

  /* ── resultado ── */
  .rbody { position:relative; flex:1; display:flex; flex-direction:column; justify-content:center; text-align:center; padding:10px 22px max(22px, env(safe-area-inset-bottom)); }
  .ring { --c:var(--teal); width:160px; height:160px; margin:0 auto 20px; border-radius:50%; position:relative; display:flex; align-items:center; justify-content:center; background:conic-gradient(var(--c) 0 82%, #13203a 82% 100%); animation:pop .35s ease-out; }
  .ring::before { content:""; position:absolute; inset:9px; border-radius:50%; background:var(--bg); }
  .ring span { position:relative; font-size:56px; color:var(--c); line-height:1; }
  .ring.bad { --c:var(--red); }
  @keyframes pop { from { transform:scale(.85); opacity:0 } to { transform:scale(1); opacity:1 } }
  .rbody h2 { font-size:28px; margin:0 0 6px; letter-spacing:-.02em; }
  .rbody p { color:var(--text2); font-size:14px; margin:0 8px 18px; }
  .kv { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:0 0 20px; }
  .kv div { background:var(--bg2); border:1px solid var(--line); border-radius:12px; padding:10px 4px; }
  .kv small { display:block; font-family:var(--mono); font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .kv b { font-size:15px; }
  .score { align-self:center; margin:-6px 0 16px; }
</style>
</head>
<body>

<div class="app">

  <!-- ═════════ CONSENTIMIENTO ═════════ (la cámara NO se abre hasta aceptar) -->
  <section class="screen" id="scrConsent">
    <div class="dots"></div><div class="glow"></div>
    <div class="bar"><div class="logo"><img src="logo-mark.png" alt="" width="26" height="26">Palmyn</div><div class="icons"><button class="lang" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg><span>ES</span></button><a class="ibtn gh" href="https://github.com/PalmynBiometrics/palmyn-palmprint-demo" target="_blank" rel="noopener" data-i18n-title="gh.title" data-i18n-aria="gh.title"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a><span class="pill" id="envPill" data-i18n="pill.demo">Public demo</span></div></div>
    <div class="cbody">
      <div class="eyebrow" data-i18n="consent.eyebrow">// Public demo</div>
      <h1 data-i18n="consent.title">Palm recognition test</h1>
      <p class="lead" data-i18n="consent.lead"></p>
      <div id="consentItems"><p class="lead" data-i18n="consent.loading">Loading…</p></div>
      <label class="opt" id="optRow" hidden><span id="optTitle"></span>
        <span class="tg"><input type="checkbox" id="stats"><span></span></span></label>
    </div>
    <div class="cfoot">
      <div class="meter" id="meter" aria-hidden="true"></div>
      <button class="btn" id="btnAccept" disabled data-i18n="consent.accept">Accept and open the camera</button>
      <p class="legal" data-i18n-html="consent.legal"></p>
    </div>
  </section>

  <!-- ═════════ CÁMARA ═════════ -->
  <section class="screen" id="scrCam" hidden>
    <div class="stage">
      <video id="video" playsinline muted></video>
      <canvas id="overlay"></canvas>
      <svg class="guide" id="guide" viewBox="20 30 260 175" aria-hidden="true"></svg>
      <div class="scan" id="scan" hidden></div>
    </div>
    <div class="bar">
      <div class="logo"><img src="logo-mark.png" alt="" width="26" height="26">Palmyn</div>
      <div class="icons">
        <button class="lang" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg><span>ES</span></button>
        <button class="ibtn" id="btnFlip" data-i18n-title="cam.flip" data-i18n-aria="cam.flip"><svg viewBox="0 0 24 24"><path d="M4 7h11l-3-3M20 17H9l3 3"/></svg></button>
        <button class="ibtn" id="btnMirror" data-i18n-title="cam.mirror" data-i18n-aria="cam.mirror"><svg viewBox="0 0 24 24"><path d="M12 3v18M8 7l-4 5 4 5M16 7l4 5-4 5"/></svg></button>
      </div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite" data-i18n="cam.opening">Opening camera…</div>
    <div class="sheet">
      <div class="seg" role="tablist">
        <button id="modeEnroll" class="on" role="tab" data-i18n="cam.enroll">Enroll</button>
        <button id="modeVerify" role="tab" data-i18n="cam.verify">Verify</button>
      </div>
      <div class="shots" id="shots" aria-hidden="true"><i></i><i></i><i></i><span id="shotsTxt"></span></div>
      <button class="btn" id="btnGo" disabled></button>
      <div class="tok"><span id="tokTxt"></span><button class="link" id="btnForget" hidden data-i18n="cam.forget">Delete token</button></div>
      <div class="rois" id="rois" hidden></div>
      <div style="text-align:center;margin-top:4px"><button class="link" id="btnRevoke" data-i18n="cam.revoke">Withdraw my consent and close the camera</button></div>
    </div>
  </section>

  <!-- ═════════ RESULTADO ═════════ -->
  <section class="screen" id="scrResult" hidden>
    <div class="dots"></div><div class="glow" id="resGlow"></div>
    <div class="bar"><div class="logo"><img src="logo-mark.png" alt="" width="26" height="26">Palmyn</div><div class="icons"><button class="lang" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg><span>ES</span></button><a class="ibtn gh" href="https://github.com/PalmynBiometrics/palmyn-palmprint-demo" target="_blank" rel="noopener" data-i18n-title="gh.title" data-i18n-aria="gh.title"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a><span class="pill" data-i18n="pill.result">Result</span></div></div>
    <div class="rbody">
      <div class="ring" id="resRing"><span id="resIcon">✓</span></div>
      <h2 id="resTitle"></h2>
      <p id="resText"></p>
      <div class="kv">
        <div><small data-i18n="res.captures">Captures</small><b>3</b></div>
        <div><small data-i18n="res.time">Time</small><b id="resTime">–</b></div>
        <div><small data-i18n="res.stored">Stored</small><b>0 B</b></div>
      </div>
      <span class="pill dev score" id="resScore" hidden></span>
      <button class="btn" id="resMain"></button>
      <button class="ghost" id="resSec"></button>
    </div>
  </section>
</div>

<script src="i18n.js"></script>
<script src="palm_preproc.js"></script>
<script type="module" src="demo.js"></script>
</body>
</html>
